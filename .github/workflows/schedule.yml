name: Bale Farming Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write  # برای push کردن به شاخه data-storage

    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data-storage
          path: data-branch
        continue-on-error: true  # اگر شاخه وجود نداشت، خطا نده

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r main/requirements.txt

      - name: Copy data.json if exists
        run: |
          if [ -f data-branch/data.json ]; then
            cp data-branch/data.json main/data.json
            echo "✅ داده‌های قبلی بارگذاری شد"
          else
            echo "⚠️ فایل داده‌ای یافت نشد، از صفر شروع می‌شود"
          fi

      - name: Run bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROVIDER_TOKEN: ${{ secrets.PROVIDER_TOKEN }}

      - name: Save data to branch
        if: always()
        run: |
          mkdir -p data-branch
          if [ -f main/data.json ]; then
            cp main/data.json data-branch/data.json
          fi
          if [ -f main/data_backup.json ]; then
            cp main/data_backup.json data-branch/data_backup.json
          fi
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data_backup.json || true
          git commit -m "Update game data [skip ci]" || echo "بدون تغییر"
          git push origin data-storage || echo "خطا در push"
