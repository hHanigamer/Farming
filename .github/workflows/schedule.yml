name: Bale Farming Bot

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت فقط به‌عنوان پشتیبان
  workflow_dispatch:

concurrency:
  group: bale-farming-bot
  cancel-in-progress: false   # اجرای در حال اجرا کنسل نشه، اجرای جدید در صف بمونه

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout main code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data from data-storage branch
        run: |
          git fetch origin data-storage || echo "شاخه داده وجود ندارد"
          git checkout origin/data-storage -- data.json 2>/dev/null || echo "data.json یافت نشد"
          git checkout origin/data-storage -- data_backup.json 2>/dev/null || echo "data_backup.json یافت نشد"

      - name: Queue next run (بدون فاصله)
        if: always()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/schedule.yml/dispatches \
            -d '{"ref":"main"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROVIDER_TOKEN: ${{ secrets.PROVIDER_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
      - name: Save data to data-storage branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -B data-storage-temp
          git rm -rf . --cached > /dev/null 2>&1 || true
          
          if [ -f data.json ]; then git add -f data.json; fi
          if [ -f data_backup.json ]; then git add -f data_backup.json; fi
          
          git commit -m "Update game data [skip ci]" || echo "بدون تغییر"
          git push origin data-storage-temp:data-storage --force
