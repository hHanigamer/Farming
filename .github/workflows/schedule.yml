name: Bale Farming Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout main code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data from data-storage branch
        run: |
          git fetch origin data-storage || echo "شاخه داده وجود ندارد"
          git checkout origin/data-storage -- data.json 2>/dev/null || echo "فایل داده یافت نشد"
          git checkout origin/data-storage -- data_backup.json 2>/dev/null || echo "فایل پشتیبان یافت نشد"

      - name: Run bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROVIDER_TOKEN: ${{ secrets.PROVIDER_TOKEN }}

      - name: Save data to data-storage branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # ذخیره در یک شاخه موقت
          git checkout -B data-storage-temp
          
          # پاک کردن فایل‌های اضافی
          git rm -rf . --cached > /dev/null 2>&1 || true
          find . -maxdepth 1 -type f ! -name 'data.json' ! -name 'data_backup.json' -exec git rm --cached {} \; > /dev/null 2>&1 || true
          
          # اضافه کردن فقط فایل‌های داده
          if [ -f data.json ]; then git add -f data.json; fi
          if [ -f data_backup.json ]; then git add -f data_backup.json; fi
          
          git commit -m "Update game data [skip ci]" || echo "بدون تغییر"
          git push origin data-storage-temp:data-storage --force
